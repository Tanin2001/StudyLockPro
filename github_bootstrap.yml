name: Import Study Lock Pro project

on:
  push:
    paths:
      - 'StudyLockPro_Flutter_Codemagic.zip'
      - '.github/workflows/import-project.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p /tmp/studylock
          unzip -q StudyLockPro_Flutter_Codemagic.zip -d /tmp/studylock
          cp -a /tmp/studylock/. .
          rm -f StudyLockPro_Flutter_Codemagic.zip
          rm -f .github/workflows/import-project.yml

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Study Lock Pro Flutter project" || exit 0
          git push
